# https://docs.codecov.io/docs/ignoring-paths
#
# Patterns are regex *and* glob. A path without /**/* is only a prefix;
# folder/* does not recurse. This repo names tests TestFoo.java (JUnit 3/4
# prefix), not FooTest.java, so **/*Test.java matches nothing useful.

ignore:
  - "runtime/Java/test/**/*"
  - "tool/test/**/*"
  - "perf-testsuite/**/*"
  - "doc/**/*"
  - "runtime/CSharp/**/*"
  - "runtime/Cpp/**/*"
  - "runtime/Python2/**/*"
  - "runtime/Python3/**/*"
  - "runtime/JavaScript/**/*"
  - "runtime/Go/**/*"
  - "runtime/Swift/**/*"
  - "runtime/PHP/**/*"
  - "runtime/Dart/**/*"
  - "runtime/ObjC/**/*"
  - "**/Test*.java"

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "diff, flags, files, footer"
