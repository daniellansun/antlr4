# https://docs.codecov.io/docs/codecov-yaml
# https://github.com/codecov/support/wiki/Codecov-Yaml
#
# Product coverage is runtime/Java/src + tool/src only. After 7ca827345 the
# v5 uploader started attaching runtime/Java/test (same packages as main)
# as 0% files (~15k executable lines). That alone moved the headline from
# ~81% to ~47%. Ignore test/benchmark/doc trees so they cannot be path-fixed
# back into the total.

ignore:
  - "runtime/Java/test"
  - "tool/test"
  - "perf-testsuite"
  - "doc"
  - "runtime/CSharp"
  - "runtime/Cpp"
  - "runtime/Python2"
  - "runtime/Python3"
  - "runtime/JavaScript"
  - "runtime/Go"
  - "runtime/Swift"
  - "runtime/PHP"
  - "runtime/Dart"
  - "runtime/ObjC"
  - "**/*Test.java"
  - "**/src/test/**"

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "diff, flags, files, footer"
